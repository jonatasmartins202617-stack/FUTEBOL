<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Altinha Brasil</title>
<style>
html,body{margin:0;padding:0;overflow:hidden;font-family:Arial;background:#000}
#ui{
position:fixed;top:10px;left:10px;color:#fff;z-index:10;
background:rgba(0,0,0,0.4);padding:10px;border-radius:10px
}
canvas{display:block}
button{margin-top:5px;padding:6px;border:0;border-radius:6px}
</style>
</head>
<body>
<div id="ui">
<div><b>Altinha Brasil - Favela Mode</b></div>
<div>Pontos: <span id="score">0</span></div>
<div>Recorde: <span id="best">0</span></div>
<div>Combo: <span id="combo">0</span></div>
<button onclick="resetGame()">Reiniciar</button>
<button onclick="togglePause()">Pausar</button>
</div>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c');
const ctx=c.getContext('2d');
c.width=innerWidth;c.height=innerHeight;

let score=0,combo=0;
let best=localStorage.getItem('best')||0;
document.getElementById('best').innerText=best;
let pause=false;

const player={x:c.width/2,y:c.height-120,w:60,h:60,frame:0,dir:0};
const ball={x:c.width/2,y:200,vx:3,vy:2,r:12};
let gravity=0.35;

window.addEventListener('mousemove',e=>{player.x=e.clientX;player.dir=(e.movementX>0)?1:-1});
window.addEventListener('touchmove',e=>{player.x=e.touches[0].clientX});

function resetGame(){score=0;combo=0;ball.x=c.width/2;ball.y=200;ball.vx=3;ball.vy=2;}
function togglePause(){pause=!pause}

function drawFavela(){
// céu
let g=ctx.createLinearGradient(0,0,0,c.height);
g.addColorStop(0,"#ff7b00");
g.addColorStop(0.5,"#2b1055");
g.addColorStop(1,"#000");
ctx.fillStyle=g;
ctx.fillRect(0,0,c.width,c.height);

// prédios favela
for(let i=0;i<30;i++){
let x=i*80;
let h=100+Math.random()*200;
ctx.fillStyle="#222";
ctx.fillRect(x,c.height-h,80,h);
ctx.fillStyle="#333";
ctx.fillRect(x+10,c.height-h+20,20,20);
ctx.fillRect(x+40,c.height-h+60,20,20);
}
}

function drawPlayer(){
player.frame+=0.1;
let bounce=Math.sin(player.frame)*3;

// corpo
ctx.fillStyle="#00ff88";
ctx.fillRect(player.x-20,player.y+bounce,40,40);

// cabeça
ctx.fillStyle="#ffcc99";
ctx.beginPath();
ctx.arc(player.x,player.y-10+bounce,12,0,Math.PI*2);
ctx.fill();

// pernas
ctx.strokeStyle="#fff";
ctx.beginPath();
ctx.moveTo(player.x-10,player.y+40+bounce);
ctx.lineTo(player.x-15,player.y+55+bounce);
ctx.moveTo(player.x+10,player.y+40+bounce);
ctx.lineTo(player.x+15,player.y+55+bounce);
ctx.stroke();
}

function update(){
if(pause) return;

ball.vy+=gravity;
ball.x+=ball.vx;
ball.y+=ball.vy;

if(ball.x<0||ball.x>c.width) ball.vx*=-1;

if(ball.y+ball.r>player.y && ball.x>player.x-30 && ball.x<player.x+30 && ball.vy>0){
ball.vy=-9;
score++;combo++;

if(combo%10===0){ball.vx*=1.1;}

gravity+=0.0004;

if(score>best){best=score;localStorage.setItem('best',best)}

document.getElementById('score').innerText=score;
document.getElementById('combo').innerText=combo;
document.getElementById('best').innerText=best;
}

if(ball.y>c.height){resetGame();}
}

function draw(){
drawFavela();

// sombra
ctx.fillStyle="rgba(0,0,0,0.3)";
ctx.beginPath();
ctx.ellipse(ball.x,player.y+60,20,6,0,0,Math.PI*2);
ctx.fill();

// bola
ctx.fillStyle="yellow";
ctx.beginPath();
ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);
ctx.fill();

drawPlayer();
}

function loop(){update();draw();requestAnimationFrame(loop)}
loop();
</script>
</body>
</html>
